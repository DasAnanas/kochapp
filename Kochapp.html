<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kochapp – Essen organisieren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Kochapp – Gestaltung im Küchenbuch-Stil: Seitenleiste, helle Karten, Bricolage Grotesque + Manrope */
:root{
  --bg:#F6F8F5; --card:#FFFFFF; --side:#EEF2EC; --hover:#E2EBDF; --ink:#1B2420; --ink2:#36423C; --muted:#5C6862; --faint:#8C978F;
  --line:#E3E8E1; --line2:#EDF1EB; --line3:#D3DBD0;
  --acc:#2E8B57; --acc-h:#257549; --acc-ink:#fff; --acc-soft:#E0F1E6; --acc-deep:#1D6A40;
  --warm:#C98A1E; --warm-soft:#FBEFD9; --warm-ink:#6B4A12;
  --ok:#2E8B57; --mid:#d9a21f; --low:#cf4b3f;
  --head:'Bricolage Grotesque',ui-sans-serif,system-ui,"Segoe UI",sans-serif; --body:'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a17; --card:#1c2420; --side:#18201c; --hover:#26322c; --ink:#e8efe9; --ink2:#cfd9d2; --muted:#97a39b; --faint:#7d8a82;
    --line:#2c3731; --line2:#273029; --line3:#3a4740; --acc:#5fb98a; --acc-h:#72c79a; --acc-ink:#0d1f16; --acc-soft:#23362c; --acc-deep:#8fd6ae;
    --warm:#f09a55; --warm-soft:#3a2a1d; --warm-ink:#f3c79f}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15}
h1,h2,h3{font-family:var(--head);font-weight:500;letter-spacing:-.01em}
h1{font-size:44px;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:24px;margin-bottom:.7rem}
h2.sec{margin:1.8rem 0 .9rem}
h3{font-size:18px}
h4.cat,.slabel{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h4.cat{margin:1.2rem 0 .4rem}
p{margin:.5rem 0}
a{color:var(--acc)}
.muted{color:var(--muted)} .sm{font-size:.86rem}
.opt{font:600 12px var(--body);background:var(--acc-soft);color:var(--acc-deep);border-radius:99px;padding:.2rem .65rem;vertical-align:middle;margin-left:.4rem;letter-spacing:0}

/* ---------- Grundgerüst ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:30px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.side .brand b{font:500 28px/1 var(--head);letter-spacing:-.01em}
.side .brand span{font:500 14px/1.3 var(--body);color:var(--muted)}
.newbtn{border:0;cursor:pointer;background:var(--acc);color:var(--acc-ink);font:600 14px var(--body);padding:12px 14px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:10px}
.newbtn:hover{background:var(--acc-h)} .newbtn span{font-size:18px;line-height:1}
.snav{display:flex;flex-direction:column;gap:2px}
.snav .slabel{padding:0 12px 8px}
.snav button{border:0;cursor:pointer;background:transparent;color:var(--ink);font:500 14px var(--body);padding:9px 12px;border-radius:8px;text-align:left;display:flex;justify-content:space-between;gap:8px}
.snav button:hover,.snav button.on{background:var(--hover)} .snav button.on{font-weight:600}
.snav button i{font-style:normal;color:var(--muted);font-weight:500}
main{padding:40px 48px 90px;min-width:0}
#view{max-width:1080px}
.mtop,.tabbar{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.ph>div{display:flex;flex-direction:column;gap:6px} .ph p{margin:0;color:var(--muted)}
.search{width:300px;background:var(--card);padding:11px 14px}

.fab{position:fixed;right:28px;bottom:28px;z-index:20;border:0;cursor:pointer;background:var(--ink);color:var(--bg);padding:13px 14px 13px 18px;border-radius:999px;display:flex;gap:10px;align-items:center;font:600 14px var(--body);box-shadow:0 14px 30px -12px rgba(20,35,28,.5)}
.fab:hover{background:var(--ink2)} .fab span{background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:3px 9px;font-size:12px}

@media (max-width:999px){
  .shell{grid-template-columns:minmax(0,1fr)} .side,.fab{display:none}
  main{padding:18px 16px 110px}
  h1{font-size:32px} .search{width:100%}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .mtop b{font:600 24px/1 var(--head);letter-spacing:-.01em}
  .mtop button{width:44px;height:44px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);cursor:pointer;font:500 22px/1 var(--body)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px 8px 18px}
  .tabbar button{border:0;cursor:pointer;min-height:48px;border-radius:12px;background:transparent;color:var(--muted);font:600 13px var(--body);display:flex;align-items:center;justify-content:center;gap:5px}
  .tabbar button.on{background:var(--acc-soft);color:var(--acc-deep)}
  .tabbar i{font:700 11px var(--body);color:var(--acc);font-style:normal}
}

/* ---------- Karten, Knöpfe, Formulare ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.card.center{text-align:center;padding:2.6rem 1.2rem}
.card.err{border-color:var(--low);background:color-mix(in srgb,var(--low) 9%,var(--card))}
.card.okbox{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));margin-top:.8rem}
.card.warnbox,.warn{background:var(--warm-soft);border-color:transparent;color:var(--warm-ink)}
.warn{padding:12px 14px;border-radius:10px;font:500 14px/1.4 var(--body)}

button{font-family:inherit}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:12px 18px;font:600 14px var(--body);cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:var(--acc-h)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:var(--side)}
.btn.dark{background:var(--ink);color:var(--bg)} .btn.dark:hover{background:var(--ink2)}
.btn.big{font-size:16px;padding:15px 28px}
.btn.sm{padding:8px 12px;font-size:13px;margin-top:.6rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:1rem}
.btnrow.end{justify-content:flex-end;border-top:1px solid var(--line2);padding-top:20px}
.x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px;padding:.15rem .4rem;border-radius:6px}
.x:hover{background:var(--line);color:var(--low)}
.back{align-self:flex-start;border:0;background:none;cursor:pointer;font:500 14px var(--body);color:var(--muted);padding:0}
.back:hover{color:var(--acc)}

input,select{font:400 15px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;outline:none}
input::placeholder{color:var(--faint)}
input:focus,select:focus{border-color:var(--acc)} button:focus-visible,[role=button]:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
label{display:flex;flex-direction:column;gap:8px;font:600 13px var(--body);color:var(--ink)}
input.narrow{width:6rem}
.addrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.7rem}
.addrow input:first-child{flex:2 1 14rem} .addrow input[type=number]{flex:0 1 7rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:.9rem 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:.7rem 0}
.dim{opacity:.45;pointer-events:none}

.fgroup{margin-bottom:1rem} .flabel{font:600 13px var(--body);margin-bottom:8px} .flabel small{font-weight:400;color:var(--muted)}
.frow{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.chips,.fchips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex-direction:row;cursor:pointer;color:inherit;font-weight:500}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.fchips button{display:inline-block;cursor:pointer;border:1px solid var(--line3);border-radius:999px;padding:7px 14px;font:500 14px var(--body);background:transparent;color:var(--ink);transition:all .12s}
.chip:hover span,.fchips button:hover{border-color:var(--ink)}
.chip input:checked + span,.fchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip input:focus-visible + span{outline:2.5px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;gap:4px;background:var(--side);border-radius:10px;padding:4px}
.seg.wrap{flex-wrap:wrap;margin-bottom:.5rem}
.seg button{border:0;background:none;color:var(--ink);padding:7px 12px;border-radius:8px;font:500 13px var(--body);cursor:pointer}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(20,35,28,.12)}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--side);border-radius:10px;padding:4px}
.step button{width:36px;height:36px;border:0;border-radius:8px;background:var(--card);cursor:pointer;font:500 18px var(--body);color:var(--ink)}
.step span{min-width:44px;padding:0 8px;text-align:center;font:600 15px var(--body)}
.step.sm{background:var(--card);padding:2px} .step.sm button{width:26px;height:26px;background:none;font-size:15px} .step.sm span{font-size:14px;min-width:52px;padding:0}
.switch{flex-direction:row;align-items:center;gap:.6rem;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;margin:.4rem 0}
.switch input{width:2.5rem;height:1.4rem;appearance:none;-webkit-appearance:none;border-radius:99px;background:var(--line3);border:0;padding:0;position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
.switch input::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--acc)} .switch input:checked::after{transform:translateX(1.1rem)}
.pills{display:flex;gap:.4rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.2rem;background:var(--warm-soft);color:var(--warm-ink);border-radius:99px;padding:.2rem .3rem .2rem .8rem;font-size:14px}
.pills2{display:flex;gap:8px;flex-wrap:wrap}
.pills2 span{font:600 14px var(--body);background:var(--side);color:var(--ink2);padding:5px 10px;border-radius:999px}
.pills2 span.acc{background:var(--acc-soft);color:var(--acc-deep)}
.tgt{background:var(--acc-soft);color:var(--acc-deep);border-radius:10px;padding:12px 14px;margin-top:.6rem}

details.filt summary,details summary{cursor:pointer;font-weight:600}
details.filt{padding:.8rem 1.2rem} details.filt[open] summary{margin-bottom:.9rem}
details summary .muted{font-weight:400;margin-left:.5rem;font-size:.88rem}

.ptable,.ings{width:100%;border-collapse:collapse}
.ptable td,.ings td{padding:9px 4px;border-top:1px solid var(--line2)}
.ptable input{width:6.5rem;padding:6px 10px}
.ings .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.st{font-size:12px;font-weight:600;border-radius:99px;padding:.15rem .6rem;white-space:nowrap}
.st.ok{background:var(--acc-soft);color:var(--acc-deep)}
.st.part{background:var(--warm-soft);color:var(--warm-ink)}
.st.miss{background:color-mix(in srgb,var(--low) 14%,transparent);color:var(--low)}
.st.basic{background:var(--side);color:var(--muted)}

/* ---------- Rezepte aus Vorrat ---------- */
.combo{border-color:var(--acc)}
.combolist{margin:.6rem 0;padding-left:1.3rem} .combolist li{margin:.25rem 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:.6rem;transition:transform .15s,box-shadow .15s}
.rc:hover{box-shadow:0 8px 20px -14px rgba(20,50,35,.35)}
.rc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.rc-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.pick{flex-direction:row;align-items:center;gap:.35rem;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.pick input{accent-color:var(--acc);width:1.1rem;height:1.1rem;padding:0}
.meta{font-size:14px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 12px var(--body);background:var(--acc-soft);color:var(--acc-deep);border-radius:999px;padding:3px 9px}
.meters{display:grid;gap:.45rem}
.mlabel{font-size:13px;color:var(--muted);margin-bottom:.2rem}
.mlabel b{color:var(--ink)}
.bar{height:6px;background:var(--side);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.alt i{background:var(--ink)}
.steps{padding-left:1.2rem;margin:.6rem 0 0} .steps li{margin:.3rem 0}

/* ---------- Einkaufsliste (Vorrat & Einkauf) ---------- */
.slist{list-style:none;padding:0;margin:0}
.slist li{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.slist li.off .nm,.slist li.off .am{text-decoration:line-through;color:var(--faint)}
.slist .am{font-variant-numeric:tabular-nums;font-weight:600} .slist .pr{color:var(--muted);font-size:13px;min-width:4.2rem;text-align:right}
.bul{color:var(--acc)}
.chk input{position:absolute;opacity:0}
.chk span{display:block;width:20px;height:20px;border:1.5px solid var(--line3);border-radius:6px;position:relative}
.chk input:checked + span{background:var(--ink);border-color:var(--ink)} .chk input:checked + span::after{content:"✓";position:absolute;inset:0;color:var(--bg);font:700 12px var(--body);display:grid;place-items:center}
.chk input:focus-visible + span{outline:2.5px solid var(--acc);outline-offset:2px}
.total{margin-top:1rem;font-size:16px}
.lh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.4rem}
pre.json{background:#10171a;color:#cfe8d8;border-radius:10px;padding:.9rem;overflow:auto;max-height:340px;font-size:12px;margin-top:.8rem}

/* ---------- Wochenplan ---------- */
.bar-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.bar-actions .btnrow{margin:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.day.cur{border-color:var(--acc)}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:.3rem;padding:10px 12px;background:var(--side);cursor:pointer;font:500 16px var(--head)}
.day header b{font-weight:500} .day header span{font:500 12px var(--body);color:var(--muted)}
.meal{padding:10px 12px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:.25rem;flex:1}
.meal.locked{background:var(--warm-soft)}
.slot{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mname{all:unset;cursor:pointer;font:500 15px/1.25 var(--head);color:var(--ink)}
.mname:hover{color:var(--acc)} .mname:focus-visible{outline:2.5px solid var(--acc)}
.mmeta{font-size:12px;color:var(--muted)}
.mbtn{display:flex;gap:4px;margin-top:.25rem}
.mbtn button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:14px;color:var(--ink)}
.mbtn button:hover{border-color:var(--acc);background:var(--acc-soft)} .mbtn button.on{border-color:var(--warm)}
@media (max-width:1500px){.week{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}

.nrow{display:grid;grid-template-columns:8.5rem 1fr 3.2rem 9rem;gap:.7rem;align-items:center;padding:.3rem 0;font-size:14px}
.nrow .np{text-align:right;font-weight:700;font-variant-numeric:tabular-nums} .nrow .na{font-size:12px}
.bar.n{height:8px}
.bar.n.ok i{background:var(--ok)} .bar.n.mid i{background:var(--mid)} .bar.n.low i{background:var(--low)}
@media (max-width:640px){.nrow{grid-template-columns:7rem 1fr 3rem}.nrow .na{display:none}}

/* ---------- Rezeptbuch: Bibliothek ---------- */
.fchips{margin-bottom:24px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.bcard{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;display:flex;gap:14px;align-items:center;transition:transform .15s,box-shadow .15s}
.bcard:hover{transform:translateY(-1px);box-shadow:0 8px 20px -14px rgba(20,50,35,.35)}
.thumb,.dt-img{background:repeating-linear-gradient(135deg,var(--a) 0 7px,var(--b) 7px 14px);overflow:hidden}
.thumb{flex:none;width:68px;height:68px;border-radius:10px}
.thumb img,.dt-img img{width:100%;height:100%;object-fit:cover;display:block}
.bc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bc-t span{font:500 13px var(--body);color:var(--muted)} .bc-t span:first-child{font-weight:600}
.bc-t b{font:500 17px/1.2 var(--head);text-wrap:pretty}
.lbtn{flex:none;cursor:pointer;border:1px solid var(--line3);background:transparent;color:var(--ink);font:600 13px var(--body);padding:0 10px;height:34px;border-radius:8px}
.lbtn:hover{border-color:var(--ink)} .lbtn.on{background:var(--acc-soft);border-color:var(--acc-soft);color:var(--acc-deep)}

/* ---------- Rezeptbuch: Detail ---------- */
.detail{display:flex;flex-direction:column;gap:36px}
.dt-top{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:center}
.dt-info{display:flex;flex-direction:column;gap:18px}
.dt-info h1{font-size:48px;line-height:1.02;letter-spacing:-.02em}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts span{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font:500 18px var(--body)}
.servbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.servbox .step span{min-width:110px} .servbox .btn{margin-left:auto}
.dt-img{height:220px;border-radius:16px;background-size:auto}
.dt-img.sm{height:150px;border-radius:12px}
.dt-body{display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;align-items:start}
.ingcard{padding:22px 22px 10px;margin:0}
.irow{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line2);line-height:1.35}
.irow span:first-child{font-weight:600;text-align:right} .irow .chg{color:var(--acc)}
.srow{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.srow span{font:500 28px/1 var(--head);color:var(--acc)}
.srow p{margin:0;font-size:17px;line-height:1.6;max-width:60ch;text-wrap:pretty}
@media (max-width:999px){.dt-top,.dt-body{grid-template-columns:minmax(0,1fr)} .dt-info h1{font-size:34px} .dt-img{height:120px;order:-1}}

/* ---------- Rezeptbuch: Neues Rezept ---------- */
.addtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
.addtabs button{cursor:pointer;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.addtabs button.on{border-color:var(--acc);background:var(--card)}
.addtabs i{font:500 11px ui-monospace,Consolas,monospace;font-style:normal;color:var(--faint)} .addtabs .on i{color:var(--acc)}
.addtabs b{font:500 21px/1.15 var(--head)} .addtabs span{font:400 13px/1.4 var(--body);color:var(--muted)}
.addcard{border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:28px}

/* ---------- Einkaufsliste des Rezeptbuchs (Schublade) ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,35,28,.2);z-index:30}

/* ---------- Dialog & Hinweis ---------- */
dialog{border:0;border-radius:18px;padding:0;max-width:min(640px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,35,28,.35)}
#dlg-body{padding:28px;max-height:80vh;overflow:auto}
.alts{list-style:none;padding:0;margin:.6rem 0}
.alts button{width:100%;display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.alts button:hover{border-color:var(--acc);background:var(--acc-soft)}
.alts .muted{grid-column:1} .alts .st{grid-row:1/3;grid-column:2;align-self:center}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,2rem);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;font:500 14px var(--body);box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:999px){#toast{bottom:96px}}

@media print{
  .side,.mtop,.tabbar,#fab,#overlay,.ph,.noprint,#toast,dialog,.card:not(.printable){display:none!important}

  @page{margin:14mm 16mm}
  html,body{background:#fff!important}
  body{font-size:11.5pt}
  .shell{display:block} main{margin:0;padding:0} #view{max-width:none}
  .card.printable{box-shadow:none;border:0;border-radius:0;background:none;padding:0;margin:0}
  .card.printable,.card.printable *{color:#000!important}
  .printable .lh{border-bottom:2pt solid #000;padding-bottom:3mm;margin-bottom:2mm}
  .printable .lh h2{font-size:22pt;margin:0}
  .printable .opt{background:none;border:0;padding:0;font-size:10pt;font-weight:400}
  .printable .opt::before{content:"· "}
  .plist{columns:2;column-gap:12mm}
  .printable h4.cat{font-size:9.5pt;letter-spacing:.08em;margin:5mm 0 1mm;padding-bottom:1mm;border-bottom:.75pt solid #000;break-after:avoid}
  .plist h4.cat:first-child{margin-top:0}
  .btnrow{display:none!important}
  .printable .slist li{grid-template-columns:auto 5.2em 1fr;gap:3mm;padding:1.6mm 0;border-bottom:.5pt dotted #999;break-inside:avoid}
  .printable .slist .am{order:1;text-align:right;font-weight:600}
  .printable .slist .nm{order:2}
  .printable .x,.printable .pr{display:none}

  .printable .slist li.off{display:none}

  .printable .chk span::after{content:none!important}
  .printable .total{margin-top:6mm;padding-top:2mm;border-top:.75pt solid #000;font-size:10pt;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation-duration:.01s!important}}

<script>
/* Kochapp – Logik (ohne DOM): Nährwerte, Filter, Rezept-Finder, Wochenplaner, Einkaufsliste */
(function (root) {
  const KA = (root.KA = root.KA || {});
  const { NUTRIENTS, ING, RECIPES, DIETS, MEALS, CATS } = KA;
  const NK = NUTRIENTS.map((n) => n.k);
  const IDX = {};
  NK.forEach((k, i) => (IDX[k] = i));
  KA.IDX = IDX;
  const REC = {};
  RECIPES.forEach((r) => (REC[r.id] = r));
  KA.REC = REC;

  /* ---------- Hilfsfunktionen ---------- */
  KA.norm = (s) =>
    String(s || '').toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

  KA.toBase = (amount, unit) => {
    const a = Number(amount) || 0;
    if (unit === 'kg' || unit === 'l') return a * 1000;
    return a;
  };

  const de = (x, d) => x.toLocaleString('de-DE', { maximumFractionDigits: d == null ? 1 : d });
  KA.fmtNum = de;
  KA.fmtAmount = (id, base) => {
    const u = ING[id].unit;
    if (u === 'Stk') return de(Math.round(base * 100) / 100, 2) + ' Stk';
    if (base >= 1000) return de(base / 1000, 2) + (u === 'g' ? ' kg' : ' l');
    return de(Math.round(base * 10) / 10, 1) + ' ' + u;
  };
  KA.fmtEUR = (x) => x.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });

  KA.price = (id, base) => {
    const i = ING[id];
    return i.unit === 'Stk' ? base * i.price : (base / 1000) * i.price;
  };

  /* ---------- Nährwerte ---------- */
  const vecScale = (v, f) => v.map((x) => x * f);
  const vecAdd = (a, b) => a.map((x, i) => x + b[i]);
  const zero = () => NK.map(() => 0);
  KA.zero = zero;

  KA.ingNutr = (id, base) => {
    const i = ING[id];
    const grams = i.unit === 'Stk' ? base * i.gpu : base;
    return vecScale(i.n, grams / 100);
  };

  const perServCache = {};
  KA.recipeNutr = (r) => {
    // Nährwerte pro Portion
    if (!perServCache[r.id]) {
      let v = zero();
      r.i.forEach(([id, a]) => (v = vecAdd(v, KA.ingNutr(id, a))));
      perServCache[r.id] = vecScale(v, 1 / r.s);
    }
    return perServCache[r.id];
  };
  KA.recipeCost = (r) => r.i.reduce((s, [id, a]) => s + KA.price(id, a), 0) / r.s;

  const flagCache = {};
  KA.recipeFlags = (r) => {
    if (!flagCache[r.id]) {
      const s = new Set();
      r.i.forEach(([id]) => ING[id].flags.forEach((f) => s.add(f)));
      flagCache[r.id] = s;
    }
    return flagCache[r.id];
  };

  /* ---------- Präferenzen / Filter ---------- */
  KA.recipeMatches = (r, prefs, slot) => {
    if (slot && !r.types.includes(slot)) return false;
    if (prefs.maxTime && r.time > prefs.maxTime) return false;
    if (prefs.maxDiff && r.diff > prefs.maxDiff) return false;
    const flags = KA.recipeFlags(r);
    const n = KA.recipeNutr(r);
    const kcal = n[IDX.kcal] || 1;
    for (const d of prefs.diets || []) {
      const def = DIETS[d];
      if (!def) continue;
      if (def.excl && def.excl.some((f) => flags.has(f))) return false;
      if (def.macro === 'lowcarb' && (n[IDX.carb] * 4) / kcal > 0.3) return false;
      if (def.macro === 'highprotein' && (n[IDX.prot] * 4) / kcal < 0.22) return false;
    }
    const dis = (prefs.dislikes || []).map(KA.norm).filter(Boolean);
    if (dis.length) {
      const hay = [KA.norm(r.name)].concat(r.i.map(([id]) => KA.norm(ING[id].name) + ' ' + id));
      if (dis.some((d) => hay.some((h) => h.includes(d)))) return false;
    }
    return true;
  };

  /* ---------- Nährstoffziele ---------- */
  const ACT = { 1.4: 'Überwiegend sitzend', 1.6: 'Leicht aktiv', 1.75: 'Moderat aktiv', 1.9: 'Sehr aktiv', 2.1: 'Extrem aktiv' };
  KA.ACTIVITY = ACT;

  KA.bodyValid = (b) => b && b.enabled && b.age > 0 && b.height > 0 && b.weight > 0;

  KA.targets = (prefs) => {
    const b = prefs.body;
    const T = {};
    let kcal, prot, sexMale = true, known = false;
    if (KA.bodyValid(b)) {
      known = true;
      sexMale = b.sex !== 'f';
      const bmr = 10 * b.weight + 6.25 * b.height - 5 * b.age + (sexMale ? 5 : -161);
      kcal = bmr * (Number(b.activity) || 1.6);
      if (b.goal === 'lose') kcal *= 0.85;
      if (b.goal === 'gain') kcal *= 1.1;
      prot = b.weight * (b.goal === 'gain' ? 1.8 : b.goal === 'lose' ? 1.6 : 1.3);
      T.bmr = bmr;
    } else {
      kcal = 2000;
      prot = 70;
    }
    kcal = Math.round(kcal / 10) * 10;
    const mc = prefs.macro;
    const custom = !!(mc && mc.enabled && mc.p + mc.c + mc.f === 100);
    if (custom) prot = (kcal * mc.p) / 400;
    const fat = custom ? (kcal * mc.f) / 900 : (kcal * 0.3) / 9;
    const carb = custom ? (kcal * mc.c) / 400 : Math.max(0, (kcal - prot * 4 - fat * 9) / 4);
    const age = known ? b.age : 30;
    const m = known ? sexMale : null; // null = Mittelwert
    const pick = (male, female) => (m === null ? (male + female) / 2 : m ? male : female);
    Object.assign(T, {
      kcal, prot: Math.round(prot), carb: Math.round(carb), fat: Math.round(fat),
      fiber: Math.max(30, Math.round((kcal / 1000) * 14)),
      vitC: pick(110, 95), vitA: pick(850, 700), vitD: 20, b12: 4, folat: 300, ca: 1000,
      fe: pick(10, age < 51 ? 15 : 10), mg: pick(350, 300), zn: pick(11, 8), k: 4000,
      known, custom,
    });
    return T;
  };
  KA.targetVec = (T) => NK.map((k) => T[k]);

  /* ---------- Rundung / Einkaufsmengen ---------- */
  KA.buyAmount = (id, a) => {
    if (a <= 1e-6) return 0;
    if (ING[id].unit === 'Stk') return Math.ceil(a - 1e-6);
    if (a <= 50) return Math.ceil(a / 5) * 5;
    if (a <= 500) return Math.ceil(a / 25) * 25;
    return Math.ceil(a / 50) * 50;
  };

  // needMap {id: baseAmount} -> sortierte Einkaufsliste
  KA.buildList = (needMap, prefs) => {
    const items = [];
    Object.keys(needMap).forEach((id) => {
      const ing = ING[id];
      if (!ing) return;
      if (prefs && prefs.assumeStaples && ing.staple) return;
      const amount = KA.buyAmount(id, needMap[id]);
      if (amount <= 0) return;
      items.push({ id, name: ing.name, cat: ing.cat, amount, unit: ing.unit, price: KA.price(id, amount), checked: true });
    });
    const order = Object.keys(CATS);
    items.sort((a, b) => order.indexOf(a.cat) - order.indexOf(b.cat) || a.name.localeCompare(b.name, 'de'));
    return items;
  };

  /* ---------- Rezept-Finder ---------- */
  KA.evalRecipe = (r, pantry, servings, prefs) => {
    const k = servings / r.s;
    const used = {};
    const lines = [];
    let csum = 0, cnt = 0;
    r.i.forEach(([id, amt]) => {
      const need = amt * k;
      const ing = ING[id];
      const have = pantry[id] || 0;
      const u = Math.min(have, need);
      const basic = prefs.assumeStaples && ing.staple;
      if (!basic) {
        used[id] = u;
        csum += u / need;
        cnt++;
      }
      lines.push({ id, need, have, used: u, missing: basic ? 0 : Math.max(0, need - u), basic });
    });
    const cover = cnt ? csum / cnt : 1;
    const pIds = Object.keys(pantry).filter((id) => pantry[id] > 0 && !(prefs.assumeStaples && ING[id] && ING[id].staple));
    let useFrac = 0, touched = 0;
    pIds.forEach((id) => {
      const u = used[id] || 0;
      if (u > 0) {
        touched++;
        useFrac += Math.min(1, u / pantry[id]);
      }
    });
    const n = pIds.length || 1;
    const score = 0.45 * (useFrac / n) + 0.35 * cover + 0.2 * (touched / n);
    return { r, score, cover, touched, pantryCount: pIds.length, useFrac: useFrac / n, used, lines, servings };
  };

  KA.findRecipes = (pantry, prefs) => {
    const list = RECIPES.filter((r) => KA.recipeMatches(r, prefs))
      .map((r) => KA.evalRecipe(r, pantry, prefs.persons || 2, prefs))
      .filter((e) => e.touched > 0);
    list.sort((a, b) => b.score - a.score);
    return list;
  };

  // Greedy: mehrere Rezepte, die zusammen möglichst viel vom Vorrat verbrauchen
  KA.bestCombo = (pantry, prefs, count) => {
    let rest = Object.assign({}, pantry);
    const chosen = [];
    const pool = RECIPES.filter((r) => KA.recipeMatches(r, prefs));
    for (let n = 0; n < count; n++) {
      let best = null;
      pool.forEach((r) => {
        if (chosen.includes(r.id)) return;
        const e = KA.evalRecipe(r, rest, prefs.persons || 2, prefs);
        if (e.touched > 0 && (!best || e.score > best.score)) best = e;
      });
      if (!best || best.score < 0.03) break;
      chosen.push(best.r.id);
      Object.keys(best.used).forEach((id) => (rest[id] = Math.max(0, (rest[id] || 0) - best.used[id])));
    }
    return chosen;
  };

  // Welcher Anteil des Vorrats wird durch die Auswahl verbraucht
  KA.pantryUsage = (ids, pantry, prefs) => {
    let rest = Object.assign({}, pantry);
    const total = {};
    ids.forEach((rid) => {
      const e = KA.evalRecipe(REC[rid], rest, prefs.persons || 2, prefs);
      Object.keys(e.used).forEach((id) => {
        total[id] = (total[id] || 0) + e.used[id];
        rest[id] = Math.max(0, (rest[id] || 0) - e.used[id]);
      });
    });
    const pIds = Object.keys(pantry).filter((id) => pantry[id] > 0 && !(prefs.assumeStaples && ING[id].staple));
    const touched = pIds.filter((id) => total[id] > 0).length;
    const mass = pIds.reduce((s, id) => s + Math.min(1, (total[id] || 0) / pantry[id]), 0);
    return { touched, count: pIds.length, massFrac: pIds.length ? mass / pIds.length : 0 };
  };

  // Einkaufsliste für Rezeptauswahl (Vorrat wird nacheinander aufgebraucht)
  KA.shoppingForRecipes = (ids, pantry, prefs) => {
    const rest = Object.assign({}, pantry);
    const need = {};
    ids.forEach((rid) => {
      const e = KA.evalRecipe(REC[rid], rest, prefs.persons || 2, prefs);
      e.lines.forEach((l) => {
        if (l.missing > 0) need[l.id] = (need[l.id] || 0) + l.missing;
      });
      Object.keys(e.used).forEach((id) => (rest[id] = Math.max(0, (rest[id] || 0) - e.used[id])));
    });
    return KA.buildList(need, prefs);
  };

  KA.cookRecipe = (rid, pantry, prefs) => {
    const e = KA.evalRecipe(REC[rid], pantry, prefs.persons || 2, prefs);
    const next = Object.assign({}, pantry);
    Object.keys(e.used).forEach((id) => {
      next[id] = Math.max(0, (next[id] || 0) - e.used[id]);
      if (next[id] < 1e-6) delete next[id];
    });
    return next;
  };

  /* ---------- Wochenplaner ---------- */
  const DAYS = 7;
  KA.DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

  KA.activeSlots = (prefs) => ['f', 'm', 'a', 's'].filter((s) => prefs.meals && prefs.meals[s]);

  const slotShare = (slots) => {
    const sum = slots.reduce((s, k) => s + MEALS[k].w, 0);
    const o = {};
    slots.forEach((k) => (o[k] = MEALS[k].w / sum));
    return o;
  };

  const MICRO_W = { vitC: 1, vitA: 1, vitD: 0.5, b12: 0.7, folat: 1, ca: 1, fe: 1, mg: 1, zn: 1, k: 1 };

  function dayLoss(v, T) {
    let L = 0;
    const c = (k) => v[IDX[k]] / T[k];
    L += 8 * Math.pow(c('kcal') - 1, 2);
    const p = c('prot');
    L += T.custom ? 3 * Math.pow(p - 1, 2) : p < 1 ? 3 * Math.pow(1 - p, 2) : p > 1.8 ? Math.pow(p - 1.8, 2) : 0;
    L += 1.0 * Math.pow(c('carb') - 1, 2);
    L += 1.0 * Math.pow(c('fat') - 1, 2);
    L += 1.0 * Math.pow(Math.max(0, 1 - c('fiber')), 2);
    return L;
  }
  function microLoss(avg, T) {
    let L = 0;
    Object.keys(MICRO_W).forEach((k) => {
      const c = avg[IDX[k]] / T[k];
      L += MICRO_W[k] * Math.pow(Math.max(0, 1 - Math.min(c, 1)), 2);
    });
    return L;
  }

  const clampStep = (x) => Math.max(0.5, Math.min(2.5, Math.round(x * 4) / 4));
  const factorFor = (r, kcalTarget) => clampStep(kcalTarget / (KA.recipeNutr(r)[IDX.kcal] || 1));

  KA.mealVec = (m) => vecScale(KA.recipeNutr(REC[m.rid]), m.f);

  KA.dayVec = (day) => day.reduce((s, m) => vecAdd(s, KA.mealVec(m)), zero());

  KA.weekAvg = (plan) => {
    const tot = plan.days.reduce((s, d) => vecAdd(s, KA.dayVec(d)), zero());
    return vecScale(tot, 1 / plan.days.length);
  };

  function planLoss(plan, T) {
    let L = 0;
    const tot = zero();
    const counts = {};
    plan.days.forEach((day) => {
      const v = KA.dayVec(day);
      L += dayLoss(v, T);
      for (let i = 0; i < tot.length; i++) tot[i] += v[i];
      const seen = {};
      day.forEach((m) => {
        counts[m.rid] = (counts[m.rid] || 0) + 1;
        if (seen[m.rid]) L += 50;
        seen[m.rid] = true;
      });
    });
    const avg = vecScale(tot, 1 / plan.days.length);
    L += 14 * microLoss(avg, T);
    Object.keys(counts).forEach((rid) => {
      if (counts[rid] > 1) L += 1.2 * (counts[rid] - 1);
    });
    return L;
  }

  KA.planSig = (prefs) =>
    JSON.stringify([prefs.diets, prefs.dislikes, prefs.maxTime, prefs.maxDiff, prefs.meals, prefs.macro && prefs.macro.enabled ? prefs.macro : null, prefs.body && prefs.body.enabled ? prefs.body : null]);

  KA.slotPool = (prefs, slot) => RECIPES.filter((r) => KA.recipeMatches(r, prefs, slot));

  KA.generatePlan = (prefs, oldPlan) => {
    const slots = KA.activeSlots(prefs);
    if (!slots.length) return { error: 'Bitte mindestens eine Mahlzeit pro Tag auswählen.' };
    const T = KA.targets(prefs);
    const share = slotShare(slots);
    const pools = {};
    for (const s of slots) {
      pools[s] = KA.slotPool(prefs, s);
      if (!pools[s].length)
        return { error: `Für „${MEALS[s].label}“ gibt es mit den aktuellen Filtern kein passendes Rezept. Lockere Ernährungsform, Zeit oder Schwierigkeit.` };
    }
    const mk = (s, r) => ({ slot: s, rid: r.id, f: factorFor(r, T.kcal * share[s]), lock: false });
    const rnd = (a) => a[Math.floor(Math.random() * a.length)];
    const plan = { days: [], sig: KA.planSig(prefs), created: Date.now() };
    for (let d = 0; d < DAYS; d++) {
      const day = slots.map((s) => {
        const old = oldPlan && oldPlan.days && oldPlan.days[d] && oldPlan.days[d].find((m) => m.slot === s && m.lock && REC[m.rid]);
        return old ? Object.assign({}, old) : mk(s, rnd(pools[s]));
      });
      plan.days.push(day);
    }
    let loss = planLoss(plan, T);
    for (let it = 0; it < 6000; it++) {
      const d = Math.floor(Math.random() * DAYS);
      const mi = Math.floor(Math.random() * slots.length);
      const m = plan.days[d][mi];
      if (m.lock) continue;
      const prev = Object.assign({}, m);
      const r = rnd(pools[m.slot]);
      if (r.id === m.rid) continue;
      m.rid = r.id;
      m.f = factorFor(r, T.kcal * share[m.slot]);
      const nl = planLoss(plan, T);
      const temp = 0.4 * (1 - it / 6000);
      if (nl < loss || Math.random() < Math.exp((loss - nl) / Math.max(temp, 1e-6)) * 0.02) loss = nl;
      else Object.assign(m, prev);
    }
    plan.loss = loss;
    return { plan, T };
  };

  // Alternativen für eine Mahlzeit, sortiert nach Gesamtqualität des Plans
  KA.alternatives = (plan, prefs, d, slot) => {
    const T = KA.targets(prefs);
    const share = slotShare(KA.activeSlots(prefs));
    const m = plan.days[d].find((x) => x.slot === slot);
    const pool = KA.slotPool(prefs, slot).filter((r) => r.id !== m.rid);
    const base = planLoss(plan, T);
    const out = pool.map((r) => {
      const prev = { rid: m.rid, f: m.f };
      m.rid = r.id;
      m.f = factorFor(r, T.kcal * share[slot]);
      const l = planLoss(plan, T);
      const f = m.f;
      m.rid = prev.rid;
      m.f = prev.f;
      return { r, f, delta: l - base };
    });
    out.sort((a, b) => a.delta - b.delta);
    return out;
  };

  KA.applyMeal = (plan, prefs, d, slot, rid, f) => {
    const m = plan.days[d].find((x) => x.slot === slot);
    const T = KA.targets(prefs);
    const share = slotShare(KA.activeSlots(prefs));
    m.rid = rid;
    m.f = f != null ? f : factorFor(REC[rid], T.kcal * share[slot]);
    m.lock = false;
  };

  KA.reroll = (plan, prefs, d, slot) => {
    const alts = KA.alternatives(plan, prefs, d, slot);
    if (!alts.length) return false;
    const top = alts.slice(0, Math.min(5, alts.length));
    const pick = top[Math.floor(Math.random() * top.length)];
    KA.applyMeal(plan, prefs, d, slot, pick.r.id, pick.f);
    return true;
  };

  KA.planShopping = (plan, prefs, pantry, subtractPantry) => {
    const need = {};
    const persons = prefs.persons || 1;
    plan.days.forEach((day) =>
      day.forEach((m) => {
        const r = REC[m.rid];
        const k = (m.f * persons) / r.s;
        r.i.forEach(([id, a]) => (need[id] = (need[id] || 0) + a * k));
      })
    );
    if (subtractPantry) Object.keys(need).forEach((id) => (need[id] = Math.max(0, need[id] - (pantry[id] || 0))));
    return KA.buildList(need, prefs);
  };

  KA.DEMO_PANTRY = {
    reis: 500, kichererbsen: 400, spinat: 200, zwiebel: 3, eier: 6, paprika: 2, dosentomaten: 800,
    kokosmilch: 400, haehnchen: 300, joghurt: 250, haferflocken: 300, kartoffeln: 1000, knoblauch: 4,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Kochapp – Bestell-Schnittstelle
 *
 * Jeder Anbieter ("Provider") ist ein Adapter mit:
 *   label    – Anzeigename
 *   fields   – Konfigurationsfelder für die Oberfläche
 *   preview(items, cfg, customer) -> Objekt  (die Anfrage, die gesendet würde)
 *   submit(items, cfg, customer)  -> Promise<{ ok, message, orderId?, total?, raw? }>
 *
 * Eigenen Shop anbinden: unten in KA.Providers einen weiteren Eintrag ergänzen
 * (oder "Eigener REST-Endpunkt" verwenden und die Antwort-Zuordnung anpassen).
 */
(function (root) {
  const KA = (root.KA = root.KA || {});

  function payload(items, customer, meta) {
    const lines = items.filter((i) => i.checked !== false);
    return {
      source: 'Kochapp',
      createdAt: new Date().toISOString(),
      currency: 'EUR',
      customer: customer || {},
      note: (meta && meta.note) || '',
      items: lines.map((i) => ({
        sku: i.id || null, // null = frei eingetragener Artikel ohne Stammdaten
        name: i.name,
        category: KA.CATS[i.cat],
        quantity: i.amount,
        unit: i.unit,
        estimatedPrice: Math.round(i.price * 100) / 100,
      })),
      estimatedTotal: Math.round(lines.reduce((s, i) => s + i.price, 0) * 100) / 100,
    };
  }
  KA.orderPayload = payload;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  KA.Providers = {
    mock: {
      label: 'Demo-Shop (Simulation)',
      help: 'Simuliert eine Bestellung ohne Netzwerk. Gut zum Ausprobieren der Abläufe.',
      fields: [],
      preview: (items, cfg, customer) => payload(items, customer),
      async submit(items, cfg, customer) {
        await sleep(900);
        const p = payload(items, customer);
        const id = 'DEMO-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        return {
          ok: true,
          orderId: id,
          total: p.estimatedTotal,
          message: `Simulierte Bestellung ${id}: ${p.items.length} Artikel, ca. ${KA.fmtEUR(p.estimatedTotal)}. Es wurde nichts wirklich bestellt.`,
          raw: p,
        };
      },
    },

    rest: {
      label: 'Eigener REST-Endpunkt (Shop-API / Webhook)',
      help:
        'Sendet die Einkaufsliste als JSON per HTTP an eine beliebige API (z. B. eigener Shop-Adapter, Zapier/Make-Webhook). ' +
        'Browser blockieren fremde Server oft per CORS – dann „Über lokalen Proxy“ aktivieren (start.bat / node server.js).',
      fields: [
        { k: 'url', label: 'Endpunkt-URL', placeholder: 'https://api.example.com/v1/orders', type: 'url' },
        { k: 'method', label: 'Methode', type: 'select', options: ['POST', 'PUT'] },
        { k: 'authHeader', label: 'Auth-Header-Name', placeholder: 'Authorization' },
        { k: 'authValue', label: 'Auth-Wert / API-Key', placeholder: 'Bearer sk-…', type: 'password' },
        { k: 'viaProxy', label: 'Über lokalen Proxy senden (umgeht CORS, Key bleibt serverseitig möglich)', type: 'checkbox' },
      ],
      preview: (items, cfg, customer) => ({
        request: {
          method: cfg.method || 'POST',
          url: cfg.url || '(URL fehlt)',
          headers: Object.assign({ 'Content-Type': 'application/json' }, cfg.authHeader && cfg.authValue ? { [cfg.authHeader]: '••••••' } : {}),
        },
        body: payload(items, customer),
      }),
      async submit(items, cfg, customer) {
        if (!cfg.url) throw new Error('Bitte zuerst eine Endpunkt-URL eintragen.');
        const body = payload(items, customer);
        const headers = { 'Content-Type': 'application/json' };
        if (cfg.authHeader && cfg.authValue) headers[cfg.authHeader] = cfg.authValue;
        let res;
        try {
          // In der Desktop-App (Kochapp.exe) sendet immer die App-Hülle – dort gibt es kein CORS.
          if (cfg.viaProxy || root.KA_DESKTOP) {
            res = await fetch('/api/order', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ target: cfg.url, method: cfg.method || 'POST', headers, payload: body }),
            });
          } else {
            res = await fetch(cfg.url, { method: cfg.method || 'POST', headers, body: JSON.stringify(body) });
          }
        } catch (e) {
          throw new Error('Anfrage fehlgeschlagen (' + e.message + '). Häufige Ursache: CORS – Option „Über lokalen Proxy“ nutzen.');
        }
        const text = await res.text();
        let json = null;
        try { json = JSON.parse(text); } catch (e) { /* kein JSON */ }
        if (!res.ok) throw new Error(`Server antwortete mit ${res.status}: ${text.slice(0, 300)}`);
        return {
          ok: true,
          orderId: json && (json.orderId || json.id),
          message: `Bestellung übermittelt (HTTP ${res.status}).` + (json && (json.orderId || json.id) ? ' Referenz: ' + (json.orderId || json.id) : ''),
          raw: json || text,
        };
      },
    },

    mailto: {
      label: 'Per E-Mail an Händler / Lieferdienst',
      help: 'Öffnet dein E-Mail-Programm mit der fertigen Bestellliste – für Hofläden, Wochenmarkt oder Lieferdienste ohne API.',
      fields: [{ k: 'to', label: 'Empfänger', placeholder: 'bestellung@hofladen.de', type: 'email' }],
      preview: (items, cfg, customer) => ({ to: cfg.to || '(Empfänger fehlt)', subject: 'Bestellung', body: KA.listToText(items, customer) }),
      async submit(items, cfg, customer) {
        const text = KA.listToText(items, customer);
        location.href = 'mailto:' + encodeURIComponent(cfg.to || '') + '?subject=' + encodeURIComponent('Bestellung') + '&body=' + encodeURIComponent(text);
        return { ok: true, message: 'E-Mail-Programm geöffnet. Bitte dort noch absenden.' };
      },
    },
  };

  KA.listToText = (items, customer) => {
    const lines = items.filter((i) => i.checked !== false).map((i) => `- ${i.id ? KA.fmtAmount(i.id, i.amount) : i.label || ''} ${i.name}`.replace('-  ', '- '));
    const c = customer || {};
    const addr = [c.name, c.street, [c.zip, c.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    return 'Einkaufsliste\n\n' + lines.join('\n') + (addr ? '\n\nLieferadresse: ' + addr : '');
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Kochapp – Oberfläche */
(function () {
  'use strict';
  const KA = window.KA;
  const { ING, REC, DIETS, CATS, NUTRIENTS, MEALS } = KA;
  const STORE = 'kochapp.v1';

  /* ---------- State ---------- */
  const DEF = () => ({
    tab: 'book',
    my: [], list: [], extras: [], done: {}, // Rezeptbuch: eigene Rezepte, Rezepte auf der Einkaufsliste, freie Artikel, Häkchen
    prefs: {
      diets: [], dislikes: [], maxTime: 60, maxDiff: 3, persons: 2, assumeStaples: true,
      meals: { f: 1, m: 1, a: 1, s: 0 },
      macro: { enabled: false, p: 20, c: 50, f: 30 },
      body: { enabled: false, sex: 'm', age: 30, height: 175, weight: 70, activity: 1.6, goal: 'keep' },
    },
    pantry: {}, sel: [], comboN: 3, plan: null, shop: null, subPantry: true,
    order: { provider: 'mock', cfg: { rest: { method: 'POST', authHeader: 'Authorization' }, mailto: {}, mock: {} }, customer: { name: '', street: '', zip: '', city: '' } },
  });
  const merge = (a, b) => {
    if (b && typeof b === 'object' && !Array.isArray(b) && a && typeof a === 'object' && !Array.isArray(a)) {
      Object.keys(b).forEach((k) => (a[k] = k in a ? merge(a[k], b[k]) : b[k]));
      return a;
    }
    return b === undefined ? a : b;
  };
  let S = DEF();
  try { S = merge(DEF(), JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) { /* ignore */ }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('Speichern fehlgeschlagen – der lokale Speicher ist voll.'); } };
  const emptyDraft = () => ({ title: '', serv: 4, time: '', cat: 'Hauptgericht', ings: [], steps: [], image: '' });
  const ui = {
    open: new Set(), nutDay: -1, preview: false, orderResult: null, ordering: false, planError: '', focus: null,
    book: 'library', selId: null, detailServ: 2, filter: 'Alle', query: '', addMode: 'manual', draft: emptyDraft(),
    scan: null, scanPhase: 'idle', link: { url: '', phase: 'idle' }, listOpen: false,
  };

  const setPath = (o, path, v) => {
    const p = path.split('.');
    const last = p.pop();
    p.forEach((k) => (o = o[k] = o[k] || {}));
    o[last] = v;
  };

  /* ---------- Helfer ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DIFF = ['', 'Einfach', 'Mittel', 'Anspruchsvoll'];
  const dots = (d) => '●'.repeat(d) + '○'.repeat(3 - d);
  const TIMES = [[15, '15 Min.'], [30, '30 Min.'], [45, '45 Min.'], [60, '60 Min.'], [90, '90 Min.'], [0, 'egal']];
  const r0 = (x) => Math.round(x);
  const portion = (f) => KA.fmtNum(f, 2);

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ---------- Gemeinsame Bausteine ---------- */
  function filterBar() {
    const p = S.prefs;
    return `
    <div class="fgroup"><div class="flabel">Ernährung <small>(frei kombinierbar)</small></div>
      <div class="chips">${Object.entries(DIETS).map(([k, d]) =>
        `<label class="chip"><input type="checkbox" data-diet="${k}" ${p.diets.includes(k) ? 'checked' : ''}><span>${esc(d.label)}</span></label>`).join('')}</div></div>
    <div class="frow">
      <div class="fgroup"><div class="flabel">Max. Zubereitungszeit</div>
        <div class="seg">${TIMES.map(([v, l]) => `<button class="${p.maxTime === v ? 'on' : ''}" data-act="setTime" data-v="${v}">${l}</button>`).join('')}</div></div>
      <div class="fgroup"><div class="flabel">Max. Schwierigkeit</div>
        <div class="seg">${[1, 2, 3].map((v) => `<button class="${p.maxDiff === v ? 'on' : ''}" data-act="setDiff" data-v="${v}">${dots(v)} ${DIFF[v]}</button>`).join('')}</div></div>
    </div>`;
  }
  const filterDetails = (key) => {
    const n = S.prefs.diets.length;
    const t = S.prefs.maxTime ? `≤ ${S.prefs.maxTime} Min.` : 'Zeit egal';
    return `<details class="card filt" data-key="${key}" ${ui.open.has(key) ? 'open' : ''}>
      <summary><b>Präferenzen</b> <span class="muted">${n ? n + ' Ernährungsform' + (n > 1 ? 'en' : '') + ' · ' : ''}${t} · bis ${DIFF[S.prefs.maxDiff].toLowerCase()}</span></summary>
      ${filterBar()}<p class="muted sm">Weitere Einstellungen (Ausschlüsse, Personen, Körperdaten) findest du im Tab „Profil“.</p></details>`;
  };

  const tag = (txt, cls) => `<span class="tag ${cls || ''}">${esc(txt)}</span>`;
  function recipeTags(r) {
    const f = KA.recipeFlags(r);
    const t = [];
    if (!f.has('fleisch') && !f.has('fisch') && !f.has('schalentier')) t.push(!f.has('milch') && !f.has('ei') && !f.has('honig') ? 'vegan' : 'vegetarisch');
    else if (!f.has('fleisch')) t.push('pescetarisch');
    if (!f.has('gluten')) t.push('glutenfrei');
    if (!f.has('milch')) t.push('laktosefrei');
    const n = KA.recipeNutr(r);
    if ((n[1] * 4) / n[0] >= 0.22) t.push('high protein');
    return t.map((x) => tag(x)).join('');
  }

  function ingTable(r, servings, ev) {
    const k = servings / r.s;
    const rows = r.i.map(([id, a]) => {
      const need = a * k;
      let st = '';
      if (ev) {
        const l = ev.lines.find((x) => x.id === id);
        if (l.basic) st = '<span class="st basic">Basis</span>';
        else if (l.used >= l.need - 1e-6) st = '<span class="st ok">vorhanden</span>';
        else if (l.used > 0) st = `<span class="st part">es fehlen ${KA.fmtAmount(id, l.missing)}</span>`;
        else st = '<span class="st miss">fehlt</span>';
      }
      return `<tr><td>${esc(ING[id].name)}</td><td class="num">${KA.fmtAmount(id, need)}</td><td>${st}</td></tr>`;
    }).join('');
    return `<table class="ings"><tbody>${rows}</tbody></table>`;
  }

  function recipeFacts(r) {
    const n = KA.recipeNutr(r);
    return `⏱ ${r.time} Min. · <span title="${DIFF[r.diff]}">${dots(r.diff)}</span> · ${r0(n[0])} kcal · ${r0(n[1])} g Eiweiß · ca. ${KA.fmtEUR(KA.recipeCost(r))} p. P.`;
  }

  function listHTML(items, opts) {
    opts = opts || {};
    if (!items.length) return '<p class="muted">Nichts zu kaufen – du hast alles da. 🎉</p>';
    let html = '';
    let cat = null;
    items.forEach((it, i) => {
      if (it.cat !== cat) {
        if (cat) html += '</ul>';
        cat = it.cat;
        html += `<h4 class="cat">${esc(CATS[cat])}</h4><ul class="slist">`;
      }
      html += `<li class="${it.checked === false ? 'off' : ''}">
        ${opts.editable ? `<label class="chk"><input type="checkbox" data-act="chk" data-i="${i}" ${it.checked === false ? '' : 'checked'}><span></span></label>` : '<span class="bul">•</span>'}
        <span class="nm">${esc(it.name)}</span><span class="am">${it.id ? KA.fmtAmount(it.id, it.amount) : esc(it.label || '')}</span>
        <span class="pr">${it.id ? KA.fmtEUR(it.price) : ''}</span>
        ${opts.editable ? `<button class="x" data-act="delitem" data-i="${i}" title="Entfernen">✕</button>` : ''}</li>`;
    });
    return html + '</ul>';
  }
  const listTotal = (items) => items.filter((i) => i.checked !== false).reduce((s, i) => s + i.price, 0);

  /* ---------- Präferenzen (direkt vor jeder Funktion) ---------- */
  function prefsCard() {
    const p = S.prefs;
    const dis = p.dislikes.map((d, i) => `<span class="pill">${esc(d)}<button data-act="deldis" data-i="${i}" title="Entfernen">✕</button></span>`).join('');
    return `<section class="card"><h2>Präferenzen</h2>${filterBar()}
      <div class="fgroup"><div class="flabel">Das mag ich nicht / vertrage ich nicht</div>
        <div class="addrow"><input id="dis-in" placeholder="z. B. Pilze, Koriander, Lachs …" autocomplete="off"><button class="btn" data-act="adddis">Hinzufügen</button></div>
        <div class="pills">${dis || '<span class="muted sm">Noch nichts ausgeschlossen.</span>'}</div></div>
      <div class="frow">
        <div class="fgroup"><div class="flabel">Personen (Portionen)</div>
          <input class="narrow" type="number" min="1" max="12" step="1" value="${p.persons}" data-bind="prefs.persons" data-num="1"></div>
        <label class="switch"><input type="checkbox" data-bind="prefs.assumeStaples" ${p.assumeStaples ? 'checked' : ''}><span>Salz, Pfeffer, Öl, Brühe & Gewürze sind immer da</span></label>
      </div></section>`;
  }

  const MACRO_PRESETS = { balanced: ['Ausgewogen', 20, 50, 30], highprotein: ['Eiweißreich', 30, 40, 30], lowcarb: ['Low Carb', 30, 25, 45], lowfat: ['Fettarm', 25, 55, 20] };

  // Nur für den Wochenplan: Mahlzeiten, Makro-Verhältnis, Körperdaten
  function planSettings() {
    const p = S.prefs, b = p.body, m = p.macro;
    const T = KA.targets(p);
    const sum = m.p + m.c + m.f;
    return `<section class="card"><h2>Plan-Einstellungen</h2>
      <div class="fgroup"><div class="flabel">Mahlzeiten pro Tag</div>
        <div class="chips">${['f', 'm', 'a', 's'].map((k) => `<label class="chip"><input type="checkbox" data-meal="${k}" ${p.meals[k] ? 'checked' : ''}><span>${MEALS[k].label}</span></label>`).join('')}</div></div>

      <h4 class="cat">Makro-Verhältnis <span class="opt">optional</span></h4>
      <label class="switch"><input type="checkbox" data-bind="prefs.macro.enabled" ${m.enabled ? 'checked' : ''}><span>Verhältnis von Eiweiß / Kohlenhydraten / Fett selbst festlegen</span></label>
      <div>
        <div class="seg wrap">${Object.entries(MACRO_PRESETS).map(([k, v]) => `<button class="${m.enabled && m.p === v[1] && m.c === v[2] && m.f === v[3] ? 'on' : ''}" data-act="setMacro" data-v="${k}">${v[0]} (${v[1]}/${v[2]}/${v[3]})</button>`).join('')}</div>
        <div class="grid4 ${m.enabled ? '' : 'dim'}"><label>Eiweiß (% der Kalorien)<input type="number" min="10" max="60" value="${m.p}" data-bind="prefs.macro.p" data-num="1"></label>
          <label>Kohlenhydrate (%)<input type="number" min="5" max="75" value="${m.c}" data-bind="prefs.macro.c" data-num="1"></label>
          <label>Fett (%)<input type="number" min="10" max="70" value="${m.f}" data-bind="prefs.macro.f" data-num="1"></label></div>
        ${sum === 100 ? `<p class="muted sm">Summe 100 % ✓</p>` : `<p class="warn">Die drei Werte müssen zusammen 100 % ergeben (aktuell ${sum} %).</p>`}
      </div>
      <p class="muted sm">Ohne eigene Vorgabe wird Eiweiß nach Körpergewicht bzw. Referenz berechnet, Fett mit 30 % und der Rest als Kohlenhydrate.</p>

      <h4 class="cat">Körperdaten <span class="opt">optional</span></h4>
      <p class="muted sm">Damit berechnet der Plan deinen Kalorien- und Nährstoffbedarf. Ohne Angaben: Referenz für Erwachsene (2.000 kcal). Die Daten bleiben nur in deinem Browser und werden nur für den Wochenplan verwendet.</p>
      <label class="switch"><input type="checkbox" data-bind="prefs.body.enabled" ${b.enabled ? 'checked' : ''}><span>Körperdaten für den Plan verwenden</span></label>
      <div class="grid4 ${b.enabled ? '' : 'dim'}">
        <label>Geschlecht<select data-bind="prefs.body.sex"><option value="m" ${b.sex === 'm' ? 'selected' : ''}>männlich</option><option value="f" ${b.sex === 'f' ? 'selected' : ''}>weiblich</option></select></label>
        <label>Alter (Jahre)<input type="number" min="14" max="99" value="${b.age}" data-bind="prefs.body.age" data-num="1"></label>

        <label>Gewicht (kg)<input type="number" min="35" max="250" value="${b.weight}" data-bind="prefs.body.weight" data-num="1"></label>
        <label>Aktivität<select data-bind="prefs.body.activity" data-num="1">${Object.entries(KA.ACTIVITY).map(([v, l]) => `<option value="${v}" ${Number(b.activity) === Number(v) ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label>Ziel<select data-bind="prefs.body.goal">${[['keep', 'Gewicht halten'], ['lose', 'Abnehmen'], ['gain', 'Muskeln aufbauen']].map(([v, l]) => `<option value="${v}" ${b.goal === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <div class="tgt"><b>Tagesziel${T.known ? '' : ' (Referenz)'}:</b> ${KA.fmtNum(T.kcal, 0)} kcal · ${T.prot} g Eiweiß · ${T.carb} g Kohlenhydrate · ${T.fat} g Fett · ${T.fiber} g Ballaststoffe
        ${T.known ? `<br><span class="muted sm">Grundumsatz ${r0(T.bmr)} kcal (Mifflin-St Jeor) × Aktivitätsfaktor, angepasst ans Ziel.</span>` : ''}</div>
      <p class="muted sm">Nährwerte sind Näherungswerte und ersetzen keine Ernährungs- oder medizinische Beratung.</p>
    </section>`;
  }

  /* ---------- Tab: Vorrat & Rezepte ---------- */
  function pantryCard() {
    const ids = Object.keys(S.pantry).sort((a, b) => ING[a].name.localeCompare(ING[b].name, 'de'));
    const rows = ids.map((id) => {
      const i = ING[id];
      return `<tr><td>${esc(i.name)}</td>
        <td><input class="pamt" type="number" min="0" step="any" value="${Math.round(S.pantry[id] * 100) / 100}" data-id="${id}"> <span class="muted">${i.unit}</span></td>
        <td><button class="x" data-act="delp" data-id="${id}" title="Entfernen">✕</button></td></tr>`;
    }).join('');
    const opts = Object.values(ING).sort((a, b) => a.name.localeCompare(b.name, 'de')).map((i) => `<option value="${esc(i.name)}"></option>`).join('');
    return `<section class="card"><h2>Mein Vorrat</h2>
      <div class="addrow">
        <input id="p-name" list="ing-list" placeholder="Lebensmittel (z. B. Reis, Eier …)" autocomplete="off">
        <input id="p-amt" type="number" min="0" step="any" placeholder="Menge">
        <select id="p-unit"><option>g</option><option>kg</option></select>
        <button class="btn" data-act="addp">Hinzufügen</button>
      </div>
      <datalist id="ing-list">${opts}</datalist>
      ${ids.length ? `<table class="ptable"><tbody>${rows}</tbody></table>` : '<p class="muted">Noch nichts eingetragen – füge Lebensmittel mit Menge hinzu oder lade einen Beispiel-Vorrat.</p>'}
      <div class="btnrow"><button class="btn ghost" data-act="demop">Beispiel-Vorrat laden</button>${ids.length ? '<button class="btn ghost" data-act="clearp">Leeren</button>' : ''}</div>
    </section>`;
  }

  function recipeCard(e, selected) {
    const r = e.r;
    const key = 'rc-' + r.id;
    return `<article class="rc ${selected ? 'sel' : ''}">
      <div class="rc-top"><h3>${esc(r.name)}</h3>
        <label class="pick" title="Für die Einkaufsliste auswählen"><input type="checkbox" data-act="togglesel" data-id="${r.id}" ${selected ? 'checked' : ''}><span>Auswählen</span></label></div>
      <div class="meta">${recipeFacts(r)}</div>
      <div class="tags">${recipeTags(r)}</div>
      <div class="meters">
        <div><div class="mlabel">Zutaten vorhanden <b>${r0(e.cover * 100)} %</b></div><div class="bar"><i style="width:${r0(e.cover * 100)}%"></i></div></div>
        <div><div class="mlabel">Verbraucht <b>${e.touched} von ${e.pantryCount}</b> Vorratsartikeln</div><div class="bar alt"><i style="width:${r0((e.touched / Math.max(1, e.pantryCount)) * 100)}%"></i></div></div>
      </div>

    </article>`;

  function viewFinder() {
    const p = S.prefs;
    const hasPantry = Object.keys(S.pantry).length > 0;
    let out = '';
    if (hasPantry) {
      const results = KA.findRecipes(S.pantry, p);
      const combo = KA.bestCombo(S.pantry, p, S.comboN);
      const sel = S.sel.filter((id) => REC[id]);
      if (!results.length) {
        out = '<section class="card"><h2>Rezepte</h2><p class="muted">Mit deinen Filtern und deinem Vorrat passt aktuell kein Rezept. Lockere die Präferenzen oder füge Lebensmittel hinzu.</p></section>';
      } else {
        const usage = KA.pantryUsage(combo, S.pantry, p);
        const same = combo.length === sel.length && combo.every((x) => sel.includes(x));
        out += `<section class="card combo"><h2>Beste Kombination <span class="opt">verbraucht möglichst viel vom Vorrat</span></h2>
          <div class="frow"><label>Anzahl Gerichte <input class="narrow" type="number" min="1" max="6" value="${S.comboN}" data-bind="comboN" data-num="1"></label>
          <span class="muted">für ${p.persons} Person${p.persons > 1 ? 'en' : ''}</span></div>

          <p>Damit werden <b>${usage.touched} von ${usage.count}</b> Vorratsartikeln verwendet (ca. ${r0(usage.massFrac * 100)} % der Mengen).</p>
          <button class="btn" data-act="takecombo" ${same ? 'disabled' : ''}>${same ? '✔ Übernommen' : 'Kombination übernehmen'}</button></section>`;

        const list = sel.length ? KA.shoppingForRecipes(sel, S.pantry, p) : [];
        out += `<section class="card"><h2>Einkaufsliste für die Reste</h2>${
          sel.length
            ? `<p class="muted">Für ${sel.length} ausgewählte${sel.length > 1 ? '' : 's'} Gericht${sel.length > 1 ? 'e' : ''}: ${sel.map((id) => esc(REC[id].name)).join(' · ')}</p>${listHTML(list)}

        out += `<h2 class="sec">Alle passenden Rezepte <span class="opt">${results.length}</span></h2><div class="rgrid">${results.slice(0, 24).map((e) => recipeCard(e, sel.includes(e.r.id))).join('')}</div>`;

      out = '<section class="card"><h2>Rezepte</h2><p class="muted">Trage zuerst deinen Vorrat ein – die App schlägt dann Rezepte vor, die möglichst viel davon verwenden, und erstellt eine Einkaufsliste für den Rest.</p><button class="btn" data-act="tab" data-v="shop">Zum Vorrat →</button></section>';
    }
    return pageHead('Rezepte aus Vorrat', 'Verwerte, was du da hast – der Rest kommt auf die Einkaufsliste.') + prefsCard() + out;
  }

  /* ---------- Tab: Wochenplan ---------- */
  function nutPanel(plan, T) {
    const day = ui.nutDay;
    const vec = day < 0 ? KA.weekAvg(plan) : KA.dayVec(plan.days[day]);
    const row = (n, i) => {
      const t = T[n.k];
      const pct = (vec[i] / t) * 100;
      let cls = 'ok';
      if (['kcal', 'carb', 'fat'].includes(n.k)) cls = Math.abs(pct - 100) <= 15 ? 'ok' : Math.abs(pct - 100) <= 30 ? 'mid' : 'low';
      else cls = pct >= 90 ? 'ok' : pct >= 60 ? 'mid' : 'low';
      return `<div class="nrow"><span class="nl">${n.label}</span><div class="bar n ${cls}"><i style="width:${Math.min(100, pct)}%"></i></div>
        <span class="np">${r0(pct)} %</span><span class="na muted">${KA.fmtNum(vec[i], vec[i] < 10 ? 1 : 0)} / ${KA.fmtNum(t, t < 10 ? 1 : 0)} ${n.unit}</span></div>`;
    };
    const idx = (g) => NUTRIENTS.map((n, i) => [n, i]).filter(([n]) => n.group === g);
    const tabs = ['Ø Woche'].concat(KA.DAYS.map((d) => d.slice(0, 2))).map((l, i) =>
      `<button class="${ui.nutDay === i - 1 ? 'on' : ''}" data-act="nutday" data-v="${i - 1}">${l}</button>`).join('');
    const avg = KA.weekAvg(plan);
    const lacks = NUTRIENTS.filter((n, i) => n.group === 'micro' && avg[i] / T[n.k] < 0.7).map((n) => n.label);
    const vegan = S.prefs.diets.includes('vegan');
    return `<section class="card"><h2>Nährstoff-Bilanz <span class="opt">pro Person</span></h2>
      <div class="seg wrap">${tabs}</div>
      <h4 class="cat">Makronährstoffe</h4>${idx('macro').map(([n, i]) => row(n, i)).join('')}
      <h4 class="cat">Mikronährstoffe</h4>${idx('micro').map(([n, i]) => row(n, i)).join('')}
      <p class="muted sm">${T.known ? 'Ziele aus deinen Körperdaten.' : 'Referenzwerte für Erwachsene (ohne Körperdaten).'} Mikronährstoff-Ziele sind Tagesempfehlungen; bewertet wird der Wochendurchschnitt.</p>
      ${lacks.length ? `<p class="warn">⚠ Wochenschnitt unter 70 %: ${lacks.join(', ')}.${vegan ? ' Bei veganer Ernährung sollten Vitamin B12 (und oft Vitamin D) ergänzt werden – sprich das ggf. mit Ärzt:in ab.' : lacks.includes('Vitamin D') ? ' Vitamin D wird bei uns kaum über Essen gedeckt (Sonne/Supplement).' : ''}</p>` : ''}
    </section>`;
  }

  function viewPlan() {
    const p = S.prefs;
    const plan = S.plan;
    const T = KA.targets(p);
    const stale = plan && plan.sig !== KA.planSig(p);
    let body = '';
    if (ui.planError) body += `<div class="card err">${esc(ui.planError)}</div>`;
    if (!plan) {
      body += `<section class="card center"><h2>Dein Wochenplan</h2><p class="muted">Erstellt aus deinen Präferenzen${T.known ? ' und Körperdaten' : ''} sieben Tage Mahlzeiten, die Makro- und Mikronährstoffe möglichst gut abdecken.</p>
        <p class="tgt">Ziel: ${KA.fmtNum(T.kcal, 0)} kcal${T.known ? '' : ' (Referenz – Körperdaten sind optional im Profil)'}</p>
        <button class="btn big" data-act="genplan">Wochenplan erstellen</button></section>`;
    } else {
      const slots = KA.activeSlots(p);
      body += `<section class="card bar-actions"><div><b>Ziel:</b> ${KA.fmtNum(T.kcal, 0)} kcal · ${T.prot} g Eiweiß${T.known ? '' : ' <span class="muted">(Referenz)</span>'}</div>
        <div class="btnrow"><button class="btn" data-act="genplan">🎲 Alles neu würfeln</button><span class="muted sm">🔒 gesperrte Mahlzeiten bleiben</span></div></section>`;
      if (stale) body += '<div class="card warnbox">Deine Präferenzen haben sich seit der Erstellung geändert. Erstelle den Plan neu, damit sie berücksichtigt werden.</div>';
      body += `<div class="week">${plan.days.map((day, d) => {
        const dv = KA.dayVec(day);
        return `<section class="day ${ui.nutDay === d ? 'cur' : ''}"><header data-act="nutday" data-v="${d}"><b>${KA.DAYS[d]}</b><span>${r0(dv[0])} kcal</span></header>
          ${day.map((m) => {
            const r = REC[m.rid];
            const kcal = KA.mealVec(m)[0];
            return `<div class="meal ${m.lock ? 'locked' : ''}"><div class="slot">${MEALS[m.slot].label}</div>
              <button class="mname" data-act="view" data-id="${r.id}" data-f="${m.f}">${esc(r.name)}</button>
              <div class="mmeta">⏱ ${r.time} Min. · ${dots(r.diff)} · ${r0(kcal)} kcal · ${portion(m.f)}× Portion</div>
              <div class="mbtn"><button data-act="reroll" data-d="${d}" data-s="${m.slot}" title="Neu würfeln (Reroll)">🎲</button>
              <button data-act="swap" data-d="${d}" data-s="${m.slot}" title="Gericht tauschen">⇄</button>
              <button class="${m.lock ? 'on' : ''}" data-act="lock" data-d="${d}" data-s="${m.slot}" title="Mahlzeit sperren">${m.lock ? '🔒' : '🔓'}</button></div></div>`;
          }).join('')}</section>`;
      }).join('')}</div>`;
      body += nutPanel(plan, T);
      body += `<section class="card"><h2>Einkaufsliste zum Plan</h2>
        <label class="switch"><input type="checkbox" data-bind="subPantry" ${S.subPantry ? 'checked' : ''}><span>Vorhandene Lebensmittel aus „Mein Vorrat“ abziehen (${Object.keys(S.pantry).length} Artikel)</span></label>
        <p class="muted sm">Mengen für ${p.persons} Person${p.persons > 1 ? 'en' : ''} (siehe Profil).</p>
        <button class="btn" data-act="toplanlist">Einkaufsliste erstellen →</button></section>`;
      void slots;
    }
    return pageHead('Wochenplan', 'Sieben Tage, abgestimmt auf Präferenzen und Nährstoffbedarf.') + prefsCard() + planSettings() + body;
  }

  /* ---------- Rezeptbuch: Bibliothek, Detail, eigene Rezepte ---------- */
  const pageHead = (title, sub, extra) => `<div class="ph"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${extra || ''}</div>`;
  const BOOK_CATS = ['Frühstück', 'Hauptgericht', 'Snack', 'Backen'];
  const TONES = [['#FDE9DF', '#F9DCCD'], ['#E3F3E8', '#D4ECDC'], ['#FFF1D6', '#FBE6BE'], ['#E6EEF8', '#D8E4F3'], ['#EEF5E0', '#E2EECC'], ['#F7E6EE', '#F0D7E3']];
  const FR = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
  const persons = (n) => n + (n === 1 ? ' Person' : ' Personen');

  // Menge frei eingetragener Zutaten (ohne Stammdaten) anzeigen, kleine Mengen als Bruch
  function fmtQ(q, unit) {
    if (q == null || q === '') return unit || '';
    let s;
    if ((unit === 'g' || unit === 'ml') && q >= 50) s = String(Math.round(q / 5) * 5);
    else if (q >= 10) s = String(Math.round(q));
    else {
      let r = Math.round(q * 4) / 4;
      if (r === 0) r = 0.25;
      const w = Math.floor(r), f = +(r - w).toFixed(2);
      s = (w ? String(w) : '') + (FR[f] || '');
    }
    return (s + ' ' + (unit || '')).trim();
  }

  // „200 g Mehl“ -> { qty, unit, name }
  function parseLine(t) {
    t = t.trim();
    const m = t.match(/^([\d.,½¼¾\/]+)?\s*(kg|g|ml|l|EL|TL|Stk|Zehen?|Prise|Bund|Dose|Becher|Pck)?\.?\s+(.+)$/i);
    if (!m || (!m[1] && !m[2])) return { qty: null, unit: '', name: t };
    let q = null;
    if (m[1]) {
      const v = m[1].replace('½', '.5').replace('¼', '.25').replace('¾', '.75').replace(',', '.');
      q = v.includes('/') ? +v.split('/')[0] / +v.split('/')[1] : parseFloat(v);
    }
    return { qty: isFinite(q) && q !== null ? q : null, unit: m[2] || (q != null ? 'Stk' : ''), name: m[3].trim() };
  }

  // Verknüpft eine freie Zutat mit den Stammdaten, wenn Name und Einheit eindeutig passen
  // (dann greifen Kategorien, Preise und das Zusammenfassen auf der Einkaufsliste).
  function linkIng(p) {
    if (p.id || p.qty == null) return p;
    const n = KA.norm(p.name);
    const ing = Object.values(ING).find((i) => KA.norm(i.name) === n);
    if (!ing) return p;
    const u = (p.unit || '').toLowerCase();
    const ok = ing.unit === 'g' ? ['g', 'kg'] : ing.unit === 'ml' ? ['ml', 'l'] : ['stk'];
    if (!ok.includes(u)) return p;
    return { id: ing.id, qty: KA.toBase(p.qty, u), unit: ing.unit, name: ing.name };
  }

  const hash = (s) => Array.from(s).reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const builtinCat = (r) => (r.types.includes('m') || r.types.includes('a') ? 'Hauptgericht' : r.types.includes('f') ? 'Frühstück' : 'Snack');
  // Einheitliche Sicht auf mitgelieferte und eigene Rezepte
  function bookRecipe(id) {
    const r = REC[id];
    if (!r) return S.my.find((x) => x.id === id) || null;
    return {
      id, title: r.name, cat: builtinCat(r), time: r.time, serv: r.s, source: 'Kochapp', builtin: true, tone: hash(id) % TONES.length,
      ings: r.i.map(([iid, a]) => ({ id: iid, qty: a, unit: ING[iid].unit, name: ING[iid].name })), steps: r.st,
    };
  }
  const allBook = () => S.my.concat(KA.RECIPES.map((r) => bookRecipe(r.id)));
  const srcLabel = (r) => (r.source === 'Web' ? 'Web · ' + r.domain : r.source);
  const ingQty = (i, f) => (i.qty == null ? i.unit || '' : i.id ? KA.fmtAmount(i.id, i.qty * f) : fmtQ(i.qty * f, i.unit));
  const toneStyle = (r) => `--a:${TONES[r.tone % TONES.length][0]};--b:${TONES[r.tone % TONES.length][1]}`;
  const recImg = (r) => (r.image ? `<img src="${esc(r.image)}" alt="${esc(r.title)}">` : '');

  function libFiltered() {
    const q = KA.norm(ui.query);
    return allBook().filter((r) => (ui.filter === 'Alle' || (ui.filter === 'Eigene' ? !r.builtin : r.cat === ui.filter)) &&
      (!q || KA.norm(r.title).includes(q) || r.ings.some((i) => KA.norm(i.name).includes(q))));
  }
  function bookCards() {
    const list = libFiltered();
    if (!list.length) return '<p class="muted">Kein Rezept gefunden.</p>';
    return list.map((r) => {
      const inL = S.list.some((l) => l.id === r.id);
      return `<div class="bcard" role="button" tabindex="0" data-act="openrec" data-id="${esc(r.id)}">
        <div class="thumb" style="${toneStyle(r)}">${recImg(r)}</div>
        <div class="bc-t"><span>${esc(srcLabel(r))}</span><b>${esc(r.title)}</b><span>${r.time} Min · ${r.serv} Pers.</span></div>
        <button class="lbtn ${inL ? 'on' : ''}" data-act="addlist" data-id="${esc(r.id)}">${inL ? '✓ Auf Liste' : '+ Liste'}</button></div>`;
    }).join('');
  }

  function viewLibrary() {
    const n = S.my.length + KA.RECIPES.length;
    return `<div class="ph"><div><h1>Meine Rezepte</h1><p>${n} Rezepte · ${S.my.length} eigene</p></div>
        <input id="bk-q" class="search" value="${esc(ui.query)}" aria-label="Rezept oder Zutat suchen" placeholder="Rezept oder Zutat suchen …" autocomplete="off"></div>
      <div class="fchips">${['Alle'].concat(BOOK_CATS, ['Eigene']).map((f) => `<button class="${ui.filter === f ? 'on' : ''}" data-act="bookfilter" data-v="${f}">${f}</button>`).join('')}</div>
      <div class="bgrid" id="bk-cards">${bookCards()}</div>`;
  }

  function viewDetail() {
    const r = bookRecipe(ui.selId);
    const f = ui.detailServ / r.serv;
    const inL = S.list.find((l) => l.id === r.id);

  // Bild verkleinern, damit es dauerhaft in den lokalen Speicher passt
  function readImage(file, cb) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { toast('Bitte JPG, PNG oder WebP wählen'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Bild konnte nicht gelesen werden'); };
    img.src = url;
  }

  /* ---------- Einkaufsliste des Rezeptbuchs (Schublade) ---------- */
  // Fasst die Zutaten aller Rezepte auf der Liste zusammen; freie Artikel kommen dazu.
  function bookAgg() {
    const agg = {};
    S.list.forEach((l) => {
      const r = bookRecipe(l.id);
      if (!r) return;
      const f = l.serv / r.serv;
      r.ings.forEach((i) => {
        if (i.id && S.prefs.assumeStaples && ING[i.id].staple) return;
        const key = i.id ? 'i|' + i.id : 'x|' + KA.norm(i.name) + '|' + (i.unit || '');
        const a = agg[key] || (agg[key] = { key, id: i.id || null, name: i.name, unit: i.unit || '', cat: i.id ? ING[i.id].cat : 'SO', qty: 0, from: [] });
        if (i.qty != null) a.qty += i.qty * f;
        if (!a.from.includes(r.title)) a.from.push(r.title);
      });
    });
    S.extras.forEach((name) => {
      const key = 'e|' + KA.norm(name);
      agg[key] = { key, id: null, name, unit: '', cat: 'SO', qty: 0, from: ['Manuell hinzugefügt'], extra: true };
    });
    return Object.values(agg);
  }

      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
      ta.remove(); return ok;
    }
  };

  function findIngredient(q) {
    const n = KA.norm(q);
    if (!n) return null;
    const all = Object.values(ING);
    return all.find((i) => KA.norm(i.name) === n || i.id === n) ||
      all.find((i) => KA.norm(i.name).startsWith(n)) ||
      all.find((i) => KA.norm(i.name).includes(n));
